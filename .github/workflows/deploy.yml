name: Deploy

# Every push to master is tested, built and published to bombo.gontzi.dev.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for Cloudflare token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy skipped
        if: steps.token.outputs.present != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this run only tested and built. Add the secret to enable deploys."
